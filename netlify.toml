# Static export: `npm run build` writes out/ (pages + sw.js). Deploys run from the CLI
# (`npm run deploy`); these settings also work if the repo is linked in the Netlify UI later.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# The service worker must always be revalidated so updates are picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
